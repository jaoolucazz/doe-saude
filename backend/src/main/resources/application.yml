spring:
  application:
    name: doesaude-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doesaude}
    username: ${DB_USER:doesaude}
    password: ${DB_PASSWORD:doesaude}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:chave-de-desenvolvimento-troque-isso-em-producao-0123456789}
    expiracao-ms: ${JWT_EXPIRACAO_MS:86400000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
