server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca pode ficar em cache: ele é quem referencia os chunks .js com hash do
    # build atual, então um index.html velho aponta pra chunks que o deploy seguinte já apagou
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
