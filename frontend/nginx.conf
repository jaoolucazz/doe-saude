server {
    listen 80;
    server_name _;
    index index.html;

    # O build de produção usa --base-href /doesaude/ (ver angular.json),
    # então o próprio index.html e os scripts já pedem os arquivos com esse
    # prefixo. Por isso servimos com "alias": a pasta física continua sendo
    # a raiz do nginx, só a URL pública que carrega o prefixo /doesaude/.
    location /doesaude/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /doesaude/index.html;
    }

    location = /doesaude {
        return 301 /doesaude/;
    }
}
