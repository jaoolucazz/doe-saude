server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O build de produção usa --base-href /doesaude/ (ver angular.json), então o próprio
    # index.html e os scripts já pedem os arquivos com esse prefixo. Servimos os dois casos
    # porque depende do proxy na frente: se ele preserva o prefixo, cai no bloco /doesaude/;
    # se ele remove o prefixo antes de encaminhar pro contêiner, cai no bloco / mesmo.
    location /doesaude/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /doesaude/index.html;
    }

    location = /doesaude {
        return 301 /doesaude/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca pode ficar em cache: ele é quem referencia os chunks .js com hash do
    # build atual, então um index.html velho aponta pra chunks que o deploy seguinte já apagou
    location = /doesaude/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
